[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "catalog-scout"
version = "0.1.0"
description = "Collect a JavaScript storefront catalog and export validated product data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "playwright>=1.58,<2",
    "requests>=2.32.5,<3",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1.5,<4"]

[project.scripts]
catalog-scout = "catalog_scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
